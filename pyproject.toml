[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "phenoGS"
description = "Pheno-GS with graph connectivity, unbalanced OT and batched modules"
requires-python = ">=3.8"
version = "0.1.0"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE.md"}
authors = [
    {name = "Alistair Wilkinson"},
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "joblib",
    "matplotlib",
    "graphtools",
    "pygsp",
]
keywords = [
    "diffusion",
    "optimal transport",
    "heat",
    "kernel",
    "sinkhorn",
    "unbalanced",
]

[project.optional-dependencies]
dev = [
    "black",
    "pylint",
    "pytest",
    "isort",
    "scanpy",
    "pytest-memray",
]
graph = [
    "scanpy",
]

[tool.setuptools]
py-modules = ["phenoGS_bms", "phenoGS_ugs", "phenoGS_gc"]

[tool.black]
line-length = 80
target-version = ["py38"]
